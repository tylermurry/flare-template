name: Deploy

# Deploys to Cloudflare Workers on every push to main.
#
# Requires two repository secrets, which the project generator sets with `gh secret set`:
#   CLOUDFLARE_API_TOKEN   - API token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#
# Without them (e.g. in the template repo itself) the deploy is skipped and the job succeeds.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.credentials.outputs.present == 'true'

      - run: npm run build
        if: steps.credentials.outputs.present == 'true'

      - name: Deploy to Cloudflare Workers
        if: steps.credentials.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
